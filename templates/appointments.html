<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments · Cedar Grove Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans">
  <div data-shell></div>

  <main data-main>
    <div data-page class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

      <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div>
          <h2 class="text-xl font-semibold tracking-tight text-slate-900">Appointments</h2>
          <p class="mt-1 text-sm text-slate-500">Every column from the booking export — scroll sideways to see them all.</p>
        </div>
        <div class="flex items-center gap-2">
          <select id="range"
                  class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-600 outline-none focus:border-accent-300 focus:ring-2 focus:ring-accent-100">
            <option value="all" selected>All time</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
          <div class="flex gap-1 rounded-lg bg-slate-100 p-1">
            <button data-view="table" class="inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-medium text-slate-600 transition">
              <i data-lucide="table-2" class="h-4 w-4"></i> Table
            </button>
            <button data-view="calendar" class="inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-medium text-slate-600 transition">
              <i data-lucide="calendar-days" class="h-4 w-4"></i> Calendar
            </button>
          </div>
        </div>
      </div>

      <div id="notice" class="mt-5 empty:hidden"></div>

      <div id="stats" class="mt-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>

      <!-- Filters -->
      <div id="filters" class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="relative flex-1">
          <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
          <input id="search" type="search" placeholder="Search by name, email or phone…"
                 class="w-full rounded-lg border border-slate-200 bg-white py-2 pl-9 pr-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-accent-300 focus:ring-2 focus:ring-accent-100" />
        </div>
        <div data-filter-wrap>
          <select id="filter-status" data-filter-label="All statuses"
                  class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-600 outline-none focus:border-accent-300 focus:ring-2 focus:ring-accent-100 sm:w-44"></select>
        </div>
        <div data-filter-wrap>
          <select id="filter-owner" data-filter-label="All owners"
                  class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-600 outline-none focus:border-accent-300 focus:ring-2 focus:ring-accent-100 sm:w-44"></select>
        </div>
        <div data-filter-wrap>
          <select id="filter-calendar" data-filter-label="All calendars"
                  class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-600 outline-none focus:border-accent-300 focus:ring-2 focus:ring-accent-100 sm:w-52"></select>
        </div>
        <div class="relative">
          <button id="columns-btn"
                  class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50">
            <i data-lucide="columns-3" class="h-4 w-4"></i> Columns
          </button>
          <div id="columns-panel" class="fade-in absolute right-0 z-20 mt-2 hidden max-h-72 w-72 overflow-y-auto rounded-xl border border-slate-200 bg-white p-1.5 shadow-lg"></div>
        </div>
        <button id="export"
                class="inline-flex items-center justify-center gap-2 rounded-lg bg-accent-600 px-3.5 py-2 text-sm font-semibold text-white transition hover:bg-accent-700">
          <i data-lucide="download" class="h-4 w-4"></i> Export CSV
        </button>
      </div>

      <div id="table" class="mt-4"></div>

      <!-- Calendar view -->
      <section id="calendar" class="mt-4 hidden rounded-xl border border-slate-200 bg-white p-5">
        <div class="flex items-center justify-between">
          <h3 id="calendar-title" class="text-sm font-semibold text-slate-900"></h3>
          <div class="flex items-center gap-1">
            <button id="cal-prev" class="grid h-8 w-8 place-items-center rounded-lg border border-slate-200 text-slate-500 transition hover:bg-slate-50">
              <i data-lucide="chevron-left" class="h-4 w-4"></i>
            </button>
            <button id="cal-today" class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-medium text-slate-600 transition hover:bg-slate-50">Today</button>
            <button id="cal-next" class="grid h-8 w-8 place-items-center rounded-lg border border-slate-200 text-slate-500 transition hover:bg-slate-50">
              <i data-lucide="chevron-right" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
        <div class="mt-4 grid grid-cols-7 gap-px overflow-hidden rounded-lg border border-slate-200 bg-slate-200 text-center">
          <div class="bg-slate-50 py-2 text-2xs font-semibold uppercase tracking-wide text-slate-500">Sun</div>
          <div class="bg-slate-50 py-2 text-2xs font-semibold uppercase tracking-wide text-slate-500">Mon</div>
          <div class="bg-slate-50 py-2 text-2xs font-semibold uppercase tracking-wide text-slate-500">Tue</div>
          <div class="bg-slate-50 py-2 text-2xs font-semibold uppercase tracking-wide text-slate-500">Wed</div>
          <div class="bg-slate-50 py-2 text-2xs font-semibold uppercase tracking-wide text-slate-500">Thu</div>
          <div class="bg-slate-50 py-2 text-2xs font-semibold uppercase tracking-wide text-slate-500">Fri</div>
          <div class="bg-slate-50 py-2 text-2xs font-semibold uppercase tracking-wide text-slate-500">Sat</div>
        </div>
        <div id="calendar-grid" class="mt-px grid grid-cols-7 gap-px overflow-hidden rounded-lg border border-slate-200 bg-slate-200"></div>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

</body>
</html>
