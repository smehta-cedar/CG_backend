<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twilio · Cedar Grove Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/theme.js"></script>
</head>
<body class="font-sans">
  <div data-shell></div>

  <main data-main>
    <div data-page class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

      <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div>
          <h2 class="text-xl font-semibold tracking-tight text-slate-900">Twilio</h2>
          <p class="mt-1 text-sm text-slate-500">SMS and voice log with delivery status, segments and spend.</p>
        </div>
        <select id="range"
                class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-600 outline-none focus:border-accent-300 focus:ring-2 focus:ring-accent-100">
          <option value="all" selected>All time</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
      </div>

      <div id="notice" class="mt-5 empty:hidden"></div>

      <div id="stats" class="mt-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>

      <!-- Delivery breakdown -->
      <section class="mt-6 rounded-xl border border-slate-200 bg-white p-5">
        <div class="flex items-baseline justify-between gap-4">
          <h3 class="text-sm font-semibold text-slate-900">Delivery rate</h3>
          <p id="delivery-rate" class="text-sm font-semibold text-slate-900"></p>
        </div>
        <div id="delivery-bar" class="mt-3 flex h-2.5 overflow-hidden rounded-full bg-slate-100"></div>
        <div id="delivery-legend" class="mt-4 flex flex-wrap gap-x-6 gap-y-2"></div>
      </section>

      <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="relative flex-1">
          <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
          <input id="search" type="search" placeholder="Search a number…"
                 class="w-full rounded-lg border border-slate-200 bg-white py-2 pl-9 pr-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-accent-300 focus:ring-2 focus:ring-accent-100" />
        </div>
        <div data-filter-wrap>
          <select id="filter-status" data-filter-label="All statuses"
                  class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-600 outline-none focus:border-accent-300 focus:ring-2 focus:ring-accent-100 sm:w-44"></select>
        </div>
        <div data-filter-wrap>
          <select id="filter-direction" data-filter-label="All directions"
                  class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-600 outline-none focus:border-accent-300 focus:ring-2 focus:ring-accent-100 sm:w-44"></select>
        </div>
        <button id="export"
                class="inline-flex items-center justify-center gap-2 rounded-lg bg-accent-600 px-3.5 py-2 text-sm font-semibold text-white transition hover:bg-accent-700">
          <i data-lucide="download" class="h-4 w-4"></i> Export CSV
        </button>
      </div>

      <div id="table" class="mt-4"></div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/csv.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    App.init({ title: 'Twilio' });
    App.statsSkeleton('#stats', 4);

    const DELIVERED = /^(delivered|received|completed|sent)$/i;
    const FAILED = /^(failed|undelivered|no-answer|no answer|busy|canceled|cancelled)$/i;

    const table = App.table({
      mount: '#table',
      search: '#search',
      range: '#range',
      exportBtn: '#export',
      exportName: 'twilio-log.csv',
      filters: [
        { el: '#filter-status', column: 'Status' },
        { el: '#filter-direction', column: 'Direction' },
      ],
      columns: ['Direction', 'Type', 'From', 'To', 'Status', 'Timestamp', 'Segments', 'Cost'],
      align: { Segments: 'right', Cost: 'right' },
      cell: {
        Direction: (value) => {
          const outbound = /out/i.test(value);
          return `<span class="inline-flex items-center gap-1.5 text-sm ${outbound ? 'text-slate-700' : 'text-accent-700'}">
            <i data-lucide="${outbound ? 'arrow-up-right' : 'arrow-down-left'}" class="h-3.5 w-3.5"></i>${App.escapeHtml(value)}</span>`;
        },
        Status: (value) => App.badge(value),
        From: (value) => `<span class="tabular-nums">${App.escapeHtml(value)}</span>`,
        To: (value) => `<span class="tabular-nums font-medium text-slate-900">${App.escapeHtml(value)}</span>`,
        Timestamp: (value) => App.fmt.dateTime(value),
        Cost: (value) => App.fmt.money(App.toNumber(value), 4),
      },
      empty: { title: 'No messages', message: 'Nothing was sent or received for this filter combination.', icon: 'message-square-off' },
      onRender: renderSummary,
    });

    function columnFor(pattern) {
      return table.columns().find((c) => pattern.test(c)) || null;
    }

    function renderSummary(rows) {
      const statusColumn = columnFor(/^status$/i);
      const costColumn = columnFor(/^cost|price/i);
      const segmentColumn = columnFor(/segment/i);

      const statuses = {};
      if (statusColumn) {
        rows.forEach((row) => {
          const key = String(row[statusColumn] || 'unknown').trim() || 'unknown';
          statuses[key] = (statuses[key] || 0) + 1;
        });
      }

      const delivered = Object.keys(statuses).filter((k) => DELIVERED.test(k)).reduce((n, k) => n + statuses[k], 0);
      const failed = Object.keys(statuses).filter((k) => FAILED.test(k)).reduce((n, k) => n + statuses[k], 0);
      const rate = rows.length ? (delivered / rows.length) * 100 : 0;
      const cost = costColumn ? rows.reduce((total, row) => total + (App.toNumber(row[costColumn]) || 0), 0) : 0;
      const segments = segmentColumn ? rows.reduce((total, row) => total + (App.toNumber(row[segmentColumn]) || 0), 0) : rows.length;

      App.renderStats('#stats', [
        { label: 'Total messages', value: App.fmt.number(rows.length), delta: -1.8, icon: 'message-square', hint: `${App.fmt.number(segments)} billable segments` },
        { label: 'Delivery rate', value: App.fmt.percent(rate, 1), delta: 0.6, icon: 'circle-check', hint: `${App.fmt.number(delivered)} delivered` },
        { label: 'Failures', value: App.fmt.number(failed), delta: -3.5, icon: 'triangle-alert', hint: 'Failed, undelivered or unanswered' },
        { label: 'Spend', value: App.fmt.money(cost, 2), delta: 2.2, icon: 'wallet', hint: `${App.fmt.money(rows.length ? cost / rows.length : 0, 4)} per message` },
      ]);

      document.getElementById('delivery-rate').textContent = `${App.fmt.percent(rate, 1)} delivered`;

      const tones = { delivered: 'bg-emerald-500', received: 'bg-emerald-400', completed: 'bg-emerald-600', sent: 'bg-sky-500', queued: 'bg-slate-300', failed: 'bg-rose-500', undelivered: 'bg-rose-400', busy: 'bg-amber-400', 'no-answer': 'bg-amber-500' };
      const entries = Object.entries(statuses).sort((a, b) => b[1] - a[1]);

      document.getElementById('delivery-bar').innerHTML = entries
        .map(([status, n]) => `<div class="${tones[status.toLowerCase()] || 'bg-slate-400'}" style="width:${(n / (rows.length || 1)) * 100}%" title="${App.escapeHtml(status)}: ${n}"></div>`)
        .join('');

      document.getElementById('delivery-legend').innerHTML = entries
        .map(([status, n]) => `
          <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full ${tones[status.toLowerCase()] || 'bg-slate-400'}"></span>
            <span class="text-sm text-slate-600">${App.escapeHtml(status)}</span>
            <span class="text-sm font-medium text-slate-900">${App.fmt.number(n)}</span>
          </div>`)
        .join('');
    }

    App.loadData('twilio', { notice: '#notice' }).then((data) => table.setData(data));
  </script>
</body>
</html>
